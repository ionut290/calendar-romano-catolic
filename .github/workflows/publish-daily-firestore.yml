name: Pubblica liturgia quotidiana su Firestore

on:
  workflow_dispatch:
  schedule:
    # Midnight in Italy is 22 UTC in summer and 23 UTC in winter.
    # The Python script verifies Europe/Rome before publishing.
    - cron: "15 22,23 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-daily-liturgy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_PROJECT_ID: ore-l-766fb
    steps:
      - uses: actions/checkout@v4
      - name: Autentica tramite Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/952052945501/locations/global/workloadIdentityPools/calendario-github/providers/github-actions
          service_account: calendario-firestore@ore-l-766fb.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze minimali
        run: python -m pip install --disable-pip-version-check "google-auth>=2.30,<3" "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Pubblica oggi e rimuovi date passate
        run: python scripts/publish_daily_firestore.py
