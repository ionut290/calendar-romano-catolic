name: Android Play - AAB firmato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Controlla presenza dei segreti di firma
        shell: bash
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Manca il secret GitHub $key. Non è possibile produrre un bundle firmato."
              exit 1
            fi
          done
      - name: Installa dipendenze e prepara Capacitor Android
        run: |
          npm install --no-audit --no-fund
          npm run android:add
      - name: Compila release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Firma l'AAB con la chiave di upload
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f upload-keystore.jks' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          jarsigner -keystore upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar calendario-cattolico-play.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify calendario-cattolico-play.aab
      - name: Conserva AAB firmato come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: calendario-cattolico-play-signed-aab
          path: calendario-cattolico-play.aab
          retention-days: 7
          if-no-files-found: error
