name: Android Capacitor - build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'firebase-daily.js'
      - 'index.html'
      - 'style.css'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/prepare-android.mjs'
      - '.github/workflows/android-capacitor.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'firebase-daily.js'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/prepare-android.mjs'
      - '.github/workflows/android-capacitor.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Controllo sorgenti
        run: npm run android:check
      - name: Prepara risorse Android
        run: npm run android:add
      - name: Compila APK debug e AAB release non firmato
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Pubblica APK debug
        uses: actions/upload-artifact@v4
        with:
          name: calendario-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Pubblica AAB non firmato (NON per Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: calendario-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
